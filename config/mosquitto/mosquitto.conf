# Mosquitto broker for the desktop shell.
#
# Runs as a USER service, not a system one. The shell, the widgets and any
# personal tool that wants live state all run as this user, so there is nothing
# for root to own here, and the socket lands in XDG_RUNTIME_DIR where it is
# cleaned up with the session.
#
# Every setting below is chosen for the smallest possible resident set. The
# packaged default config enables TLS on 8883, an anonymous listener on 1883 and
# persistence -- all three cost memory and none of it is wanted for a bus that
# carries a few dozen small retained messages.

# ---------------------------------------------------------------------------
#  Listeners
# ---------------------------------------------------------------------------
# A unix socket is the cheapest transport there is: no TCP stack, no port, and
# filesystem permissions do the access control. This is what the shell uses.
listener 0 /run/user/1000/mosquitto.sock

# Loopback TCP as well, because most client libraries only speak TCP. Bound to
# 127.0.0.1 explicitly -- without the bind_address mosquitto listens on every
# interface, which would put desktop state on the local network.
listener 1883 127.0.0.1

allow_anonymous true

# ---------------------------------------------------------------------------
#  Memory
# ---------------------------------------------------------------------------
# Hard ceiling on everything mosquitto allocates. The real working set is a few
# hundred kilobytes; 16 MB is generous headroom that still turns a runaway
# publisher into a refused message rather than a machine under memory pressure.
memory_limit 16777216

# No persistence: the whole point of the retained state here is that it is
# current. Writing it to disk would add a periodic fsync and a memory-resident
# database for values that are stale the moment the machine resumes anyway.
persistence false

# Payloads on this bus are single JSON objects, largest measured under 600
# bytes. 8 KiB leaves room to grow and caps what a broken publisher can queue.
# max_packet_size, not message_size_limit -- 2.1 deprecated the latter and logs
# a note about it on every start.
max_packet_size 8192

# One subscriber per signal plus a handful of tools. 30 is far above the real
# count and each slot costs a struct.
max_connections 30

# Queue depth per client. These messages are retained state, not a log: if a
# subscriber is so far behind that 50 updates have piled up, the 51st is the
# only one that matters anyway.
max_queued_messages 50
max_inflight_messages 20

# The $SYS tree publishes broker statistics on a timer. Nothing here reads it,
# and disabling it removes both the periodic wakeup and the tree itself.
sys_interval 0

# ---------------------------------------------------------------------------
#  Logging
# ---------------------------------------------------------------------------
# To the journal through stderr, errors and warnings only. The default also logs
# every connect, disconnect and subscribe, which for a bus with reconnecting
# clients is a steady write for no benefit.
log_dest stderr
log_type error
log_type warning
connection_messages false

# Latency, not memory: without this, Nagle's algorithm can hold a small publish
# back by tens of milliseconds waiting for more data to coalesce. Everything on
# this bus is a small publish.
set_tcp_nodelay true
