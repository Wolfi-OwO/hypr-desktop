# Colour temperature schedule -- the night light lost with GNOME.
#
# Profiles are applied at their `time`, and the one in force is whichever came
# most recently, so the day only needs its boundaries described rather than
# every hour.
#
# The temperatures are deliberately not extreme. 6000K is roughly daylight and
# is what the panel does untouched; 4000K in the evening is a clear warm shift
# without turning the screen orange, and 3400K late at night goes further at the
# point where colour accuracy stops mattering. A filter aggressive enough to
# fight is a filter that gets switched off.
#
# Fixed times rather than real sunrise and sunset: the weather cache carries no
# solar data, and computing it would mean putting the machine's real
# coordinates somewhere -- the published config deliberately carries only a
# generic placeholder. These boundaries suit Central European hours year round;
# the difference from true sunset is at most about an hour in midsummer, which
# a gradual warm shift absorbs without anyone noticing.

# Morning: back to neutral. identity = true bypasses the colour matrix
# entirely rather than approximating 6500K, so daytime is genuinely unmodified.
profile {
    time = 06:30
    identity = true
}

# Evening: the first warm step, around dusk for most of the year.
profile {
    time = 20:00
    # 4500 statt 4000. Bei 4000 K faerbt sich der ganze Desktop deutlich
    # gelb -- das faellt erst auf, seit der Dienst ueberhaupt laeuft (der
    # gamma-Wert verhinderte das vorher). 4500 K ist noch klar waermer als
    # Tageslicht, kippt aber nicht ins Orange.
    temperature = 4500
    # hyprsunset reads gamma as a FRACTION and reports it as a percentage, so
    # gamma = 100 came out as "10000%" and the daemon refused to start with
    # "Gamma invalid: 10000%. The gamma has to be between 0% and 100%". 1.0 is
    # full brightness.
    gamma = 1.0
}

# Late night: warmer still, and slightly dimmed. By this hour the screen is the
# brightest thing in the room and gamma does more for comfort than temperature.
profile {
    time = 23:00
    temperature = 3800
    gamma = 0.9
}
