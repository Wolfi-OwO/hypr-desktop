# Colour temperature -- profiles DELIBERATELY REMOVED.
#
# hyprsunset's own schedule is a single flat list that applies to every day
# alike; it has no concept of weekdays. The schedule now lives in
# ~/.config/hypr/sunset-schedule.json and is driven by hypr-sunset-scheduler,
# which resolves weekday plus hour and pushes the value in over hyprctl.
#
# Leaving profiles here as well would mean TWO schedules driving one daemon:
# whichever fired last wins, and the colour flips back and forth at every
# boundary. So this file now only starts hyprsunset in a neutral state.
#
# Manual override: SUPER+SHIFT+N, or hyprctl hyprsunset temperature <K>.
# The scheduler takes over again at the next boundary.
