################################################################################
### HYPRLOCK — Catppuccin Mocha
### Bound to SUPER+L (same as your GNOME lock binding).
### Test it safely with:  hyprlock --grace 2   (auto-unlocks after 2s)
################################################################################

# CAUTION: the following eight lines are replaced by `hypr-appearance` with
# sed when switching between light and dark. Do not remove the
# ### THEME-START / ### THEME-END markers and do not reformat the lines --
# switching stops working if you do.
#
# The background is the same source image as the login screen
# (/usr/share/sddm/themes/trans-woofi/background.png), so booting and Super+L
# look identical. hyprlock does blur by itself, but the image is pre-blurred so
# that SDDM -- which cannot blur -- matches it.
### THEME-START
$wallpaper = /home/woofi/.local/share/backgrounds/lock-dark.png
$base     = rgb(241d2f)
$text     = rgb(fdf6fb)
$subtext  = rgb(d3c5dd)
$mauve    = rgb(f279b9)
$lavender = rgb(5bcefa)
$inner    = rgba(36, 29, 47, 0.75)
### THEME-END

# unchanged in both variants
$crust    = rgb(0e1017)
$surface0 = rgb(2a2f42)
$blue     = rgb(5bcefa)
$red      = rgb(ff8fa8)
$green    = rgb(8fe0a8)
$yellow   = rgb(f7d9a0)

# WIDGET SCALE = 1.7x -- this is MEASURED, not chosen by eye.
#
# The SDDM greeter draws its clock, greeting, avatar and input box on a fixed
# 1440x900 stage which it then scales:
#
#     Item { id: buehne; width: 1440; height: 900
#            anchors.centerIn: parent; scale: rootItem.su }
#     readonly property real su: Math.min(width/1440, height/900) * 0.85
#
# SDDM's X server runs at the panel's full 2880x1800 (confirmed in Xorg.0.log),
# so su = min(2, 2) * 0.85 = 1.7 exactly. The greeter's clock is therefore
# 96 * 1.7 = 163 physical pixels.
#
# hyprlock draws directly in PHYSICAL pixels -- no stage, no scale property --
# so matching the greeter means multiplying every design value by that same
# 1.7. At 1x the lock screen was half the greeter's size and read as "zoomed
# out"; at 2x it overshot.
#
# Do not edit these numbers by hand. Use:  hypr-lock-scale 1.7
# It rescales the whole set from hyprlock.conf.design, so fonts, positions,
# boxes, shadows, outline and rounding stay in proportion to each other.

general {
    hide_cursor = true
    ignore_empty_input = true
    fractional_scaling = 2      # 2 = auto; this panel runs at scale 2
    immediate_render = false
}

################
### ANIMATION ##
################
animations {
    enabled = true

    bezier = smoothOut, 0.36, 0, 0.66, -0.56
    bezier = smoothIn,  0.25, 1, 0.5,  1
    bezier = easeOutQuint, 0.23, 1, 0.32, 1

    animation = fadeIn,  1, 4.0, easeOutQuint
    animation = fadeOut, 1, 3.0, smoothOut
    animation = inputFieldDots, 1, 2.0, linear
}

##################
### BACKGROUND ###
##################
background {
    monitor =
    path = $wallpaper

    # No post-processing: lock-dark.png is ALREADY blurred on disk, and is
    # byte-for-byte the same file as the SDDM theme's background.png. hyprlock
    # was blurring it a SECOND time and darkening it on top, so locking visibly
    # changed the wallpaper -- blurrier and darker than the greeter, which reads
    # as the image having zoomed.
    #
    # Briefly reverted on suspicion after hyprlock died on a SUPER+L, then
    # restored: tested directly with `hyprlock --config` against this exact
    # block and it starts and renders with no errors. The real cause was an
    # unguarded lock bind racing hypridle -- see hyprland.lua.
    blur_passes = 0
    noise = 0.0
    contrast = 1.0
    brightness = 1.0
    vibrancy = 0.0
    vibrancy_darkness = 0.0
}

#############
### CLOCK ###
#############
# Greeting
label {
    monitor =
    text = cmd[update:60000] /home/woofi/.local/bin/hypr-greeting
    color = $subtext
    font_size = 29
    font_family = FiraCode Nerd Font
    position = 0, 542
    halign = center
    valign = center
}

# Large clock
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = $text
    font_size = 163
    font_family = FiraCode Nerd Font Light
    position = 0, 388
    halign = center
    valign = center

    shadow_passes = 3
    shadow_size = 10
    shadow_color = $crust
    shadow_boost = 1.2
}

# Deutsches Langdatum
label {
    monitor =
    text = cmd[update:60000] LC_TIME=de_DE.UTF-8 date +"%A, %d. %B %Y"
    color = $lavender
    font_size = 29
    font_family = FiraCode Nerd Font
    position = 0, 287
    halign = center
    valign = center

    shadow_passes = 2
    shadow_size = 7
    shadow_color = $crust
}

# Stripes in the flag order, directly below the date.
#
# An image rather than a shape: this version of hyprlock has no `shape` blocks
# and no gradients. lock-assets.gen.py pre-renders the stripes and the ring --
# both consist only of flag colours, so they apply to light and dark alike.
image {
    monitor =
    path = /home/woofi/.local/share/backgrounds/lock-stripe.png
    size = 354
    rounding = 0
    border_size = 0
    position = 0, 246
    halign = center
    valign = center
}

####################
### ANMELDEKARTE ###
####################
# Groups the avatar, the name and the input field into one unit. An image,
# because hyprlock has neither shapes nor gradients -- lock-assets.gen.py and
# the card generator pre-render it. Square for the same reason as the stripes:
# `size` sets a square frame.
image {
    monitor =
    path = /home/woofi/.local/share/backgrounds/lock-card.png
    size = 680
    rounding = 0
    border_size = 0
    position = 0, -104
    halign = center
    valign = center
}

##############
### AVATAR ###
##############
# Ring with ears. Must come BEFORE the image -- hyprlock draws in block order,
# so later blocks sit on top.
image {
    monitor =
    path = /home/woofi/.local/share/backgrounds/lock-ring.png
    size = 299
    rounding = 0
    border_size = 0
    position = 0, -17
    halign = center
    valign = center
}

image {
    monitor =
    path = /var/lib/AccountsService/icons/woofi
    size = 204
    rounding = -1              # -1 = vollstaendig rund
    border_size = 0            # the border comes from the ring underneath
    # Same centre point as the ring underneath.
    position = 0, -34
    halign = center
    valign = center
}

####################
### INPUT FIELD ####
####################
input-field {
    monitor =
    size = 510, 85
    outline_thickness = 3
    rounding = 42

    dots_size = 0.26
    dots_spacing = 0.3
    dots_center = true
    dots_rounding = -1

    outer_color = $mauve
    inner_color = $inner
    font_color = $text
    font_family = FiraCode Nerd Font

    placeholder_text = <span foreground="##aab3c4"><i>Passwort eingeben…</i></span>
    fail_text = <span foreground="##ff8fa8">$FAIL ($ATTEMPTS)</span>
    fail_color = $red

    check_color = $yellow
    capslock_color = $yellow
    numlock_color = -1
    bothlock_color = -1
    invert_numlock = false

    fade_on_empty = false
    swap_font_color = false

    position = 0, -280
    halign = center
    valign = center

    shadow_passes = 2
    shadow_size = 7
    shadow_color = $crust
}

#####################
### STATUS LABELS ###
#####################
# Logged-in user
label {
    monitor =
    text = $DESC
    color = $subtext
    font_size = 26
    font_family = FiraCode Nerd Font
    position = 0, -201
    halign = center
    valign = center
}

# Battery, bottom-left.
# Icons go through printf '\Uxxxxxxxx' rather than literal glyphs: hyprlang
# has no \u escape syntax, but these labels run through a shell, so printf
# does the decoding. \U000f0079=md-battery, \U000f0084=md-battery-charging.
label {
    monitor =
    text = cmd[update:30000] printf "$(printf '\U000f0079')  %s%%%s" "$(cat /sys/class/power_supply/BAT0/capacity)" "$([ "$(cat /sys/class/power_supply/BAT0/status)" = Charging ] && printf "  $(printf '\U000f0084')")"
    color = $subtext
    font_size = 24
    font_family = FiraCode Nerd Font
    position = 54, 48
    halign = left
    valign = bottom
}

# Keyboard layout reminder, bottom-right (you're on the German layout)
label {
    monitor =
    text = cmd[update:2000] hyprctl devices -j | jq -r '.keyboards[] | select(.main==true) | .active_keymap' 2>/dev/null || echo "German"
    color = $subtext
    font_size = 24
    font_family = FiraCode Nerd Font
    position = -54, 48
    halign = right
    valign = bottom
}
