# Wallpaper in the trans flag palette. Generated by trans-mesh.gen.py and
# trans-mesh-light.gen.py; the widget zones are deliberately kept quiet so the
# clock, weather card and calendar stay readable on top of them.

# Preload BOTH variants here. `preload` loads asynchronously: when it was
# issued only at switch time together with `wallpaper`, the image was not in
# memory yet and hyprpaper showed something else for a moment. Preloaded, the
# switch is nothing more than a pointer change.
preload = /home/woofi/.local/share/backgrounds/trans-mesh-2880x1800.png
preload = /home/woofi/.local/share/backgrounds/trans-mesh-light-2880x1800.png

wallpaper = eDP-1,/home/woofi/.local/share/backgrounds/trans-mesh-2880x1800.png
splash = false
ipc = on
