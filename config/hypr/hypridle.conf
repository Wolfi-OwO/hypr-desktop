# Idle policy for the laptop.
#
# There was none before this: the screen never dimmed, never locked itself, and
# the machine relied entirely on systemd's lid handling. Leaving a laptop
# unlocked on a desk indefinitely is the actual problem being solved here; the
# battery saving is a side effect.
#
# The stages are deliberately ordered so that each one is recoverable before the
# next is reached. Dimming warns you that a lock is coming; the lock is silent
# but reversible; only after that does the display power down.

# DISPATCHER SYNTAX -- this machine runs the Hyprland LUA config plugin, so
# `hyprctl dispatch ...` is evaluated as Lua, not as a plain dispatcher string.
# `hyprctl dispatch dpms on` therefore fails with
#     [string "return hl.dispatch(dpms on)"]:1: ')' expected near 'on'
# and quoting the argument does not help -- the whole thing is still Lua. The
# working form is the dispatcher object: hl.dsp.dpms("on"). Verified by running
# an off/on round trip and checking dpmsStatus afterwards.

general {
    # hyprlock is the lock screen everywhere else on this machine (SUPER+L, and
    # the SDDM theme is built to mirror it), so it is what idle uses too.
    # Same atomic wrapper as the keybind -- see ~/.local/bin/hypr-lock.
    lock_cmd = /home/woofi/.local/bin/hypr-lock
    # Runs when something ELSE locks the session (loginctl
    # lock-session, a desktop menu). Without it an external lock
    # request marks the session locked with nothing on screen.
    on_lock_cmd = /home/woofi/.local/bin/hypr-lock
    # Lock BEFORE suspending, not after waking. If the lock only ran on resume
    # there is a window where the screen is already back and unlocked.
    before_sleep_cmd = loginctl lock-session
    # After waking, bring the backlight back. Without this the screen returns at
    # whatever level the dim step left it at, and it looks like a failed resume.
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms("on")'
}

# 4 min -- dim the backlight as a warning.
#
# brightnessctl -s saves the current level so -r can restore exactly what the
# user had, rather than guessing a percentage back.
listener {
    timeout = 240
    on-timeout = brightnessctl -s set 10
    on-resume  = brightnessctl -r
}

# 5 min -- lock. One minute after the dim, which is long enough to notice the
# warning and move the mouse.
listener {
    timeout = 300
    on-timeout = /home/woofi/.local/bin/hypr-lock
}

# 8 min -- screen off. Well after the lock, so the display powering down is
# never the thing that hides an unlocked session.
listener {
    timeout = 480
    on-timeout = hyprctl dispatch 'hl.dsp.dpms("off")'
    on-resume  = hyprctl dispatch 'hl.dsp.dpms("on")'
}

# 20 min -- suspend.
#
# Deliberately long. This machine resumes from s2idle only (no deep S3 is
# offered by the firmware), and a resume was measured at 92 s before the sleep
# hook was fixed; suspending eagerly on a machine that resumes slowly trades a
# little battery for a lot of waiting.
listener {
    timeout = 1200
    on-timeout = systemctl suspend
}
