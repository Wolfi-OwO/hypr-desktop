# Idle policy: dim -> lock -> screen off -> suspend, each stage recoverable
# before the next kicks in.
#
# Skipped outright while the charger is connected (ADP0/online) -- plugged in
# and idle is a desk, not a battery you're trying to save. Read directly from
# sysfs (/sys/class/power_supply/ADP0/online).
#
# This machine runs the Hyprland Lua config plugin, so dispatches need the
# object form: hl.dsp.dpms("on"), not a plain "dpms on" string.

general {
    lock_cmd = /home/woofi/.local/bin/hypr-lock
    # NOT on_lock_cmd here too, on purpose. lock_cmd fires on the logind
    # "Lock" REQUEST (what `loginctl lock-session` sends) -- that's what
    # actually starts hyprlock. on_lock_cmd fires later, on the separate
    # hyprland-lock-notify-v1 CONFIRMATION that the session is now locked --
    # a notification, not a request. Setting it to the same hypr-lock command
    # re-invoked hypr-lock a second time on every single lock (confirmed live
    # in `journalctl --user -u hypridle`: "Wayland session got locked" is
    # immediately followed by a second "Executing hypr-lock" on every one of
    # the last 10 real lock events). hypr-lock's flock caught every one of
    # them and exited quietly, so it never started a second hyprlock -- but
    # it was still dead weight running on every lock for no reason, and the
    # exact "two things can ask for a lock" shape this file's own history
    # (see hyprland.lua) already fixed once for the SUPER+L bind.
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = /home/woofi/.local/bin/hypr-post-resume
}

# 4 min -- dim as a warning, screen and keyboard backlight together. Each
# device saves/restores through its own state file (keyed by device name), so
# the two -s/-r pairs don't collide with each other.
listener {
    timeout = 240
    on-timeout = sh -c '[ "$(cat /sys/class/power_supply/ADP0/online 2>/dev/null)" = "1" ] || (brightnessctl -s set 10 && brightnessctl -d platform::kbd_backlight -s set 0)'
    on-resume  = brightnessctl -r && brightnessctl -d platform::kbd_backlight -r
}

# 5 min -- lock.
listener {
    timeout = 300
    on-timeout = sh -c '[ "$(cat /sys/class/power_supply/ADP0/online 2>/dev/null)" = "1" ] || /home/woofi/.local/bin/hypr-lock'
}

# 8 min -- screen off. Dims to 0 instead of DPMS off: toggling DPMS while
# hyprlock is running crashes it (hyprwm/hyprlock#953).
listener {
    timeout = 480
    # No -s here: brightnessctl keeps ONE saved value per device, and this
    # fires after the 240s listener has already dimmed the screen. Saving
    # again at this point would save the DIMMED value, not the original --
    # measured: a restore from this deep landed at 3% (the 240s stage's
    # dim level), never back at the real pre-idle brightness. Leaving the
    # save alone means both this and the 240s listener's on-resume restore
    # to the one true original value; calling -r twice is harmless.
    on-timeout = sh -c '[ "$(cat /sys/class/power_supply/ADP0/online 2>/dev/null)" = "1" ] || brightnessctl set 0'
    on-resume  = brightnessctl -r
}

# 20 min -- suspend. Long on purpose, this machine resumes slowly (s2idle
# only, no S3).
listener {
    timeout = 1200
    on-timeout = sh -c '[ "$(cat /sys/class/power_supply/ADP0/online 2>/dev/null)" = "1" ] || systemctl suspend'
}
