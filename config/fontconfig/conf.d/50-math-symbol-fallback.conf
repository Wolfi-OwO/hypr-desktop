<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!--
    Discord (and anything else using the generic sans-serif/serif/monospace
    families) rendered decorative Unicode channel names as tofu boxes even
    though a fully-covering font was already on disk. Measured with
    `hyprctl clients -j` against a live Discord window: channel/server
    titles carried Mathematical Alphanumeric Symbols (U+1D400-U+1D7FF, e.g.
    U+1D405 "bold F", U+1D5B3 "sans-serif T"). `fc-match sans` resolved to
    DejaVu Sans, which covers only part of that block (the plain
    sans-serif subrange, not bold/italic/etc), so some glyphs showed and
    others didn't, matching the "partially rendered" category headers.

    fc-list :charset showed "DejaVu Math TeX Gyre" (shipped by ttf-dejavu,
    already a dependency on this system) covers every codepoint that was
    missing, but it was never in the fallback chain for the generic
    families, so Chromium/Electron's font substitution never reached it.
    This appends it as a fallback: it only supplies glyphs the primary
    font lacks, so it can't override anyone's actual UI font.

    A second gap surfaced on the same sidebar after this fix: a role badge
    reading a lightning-bolt emoji followed by two tofu boxes, an equals
    sign, then a third tofu box, next to a username. Scanned the Fullwidth
    Forms block (U+FF00 through U+FFEF) codepoint by codepoint with
    fc-list's charset query: 237 of 239 codepoints in that block had no
    installed font at all (not a fallback-chain miss, an actual coverage
    hole), including U+FF1D FULLWIDTH EQUALS SIGN, which is the "=" in that
    badge. No package already on this system covers Fullwidth Forms: DejaVu
    Math TeX Gyre doesn't, and noto-fonts / noto-fonts-extra (tested by
    installing them) don't either, that block ships only in noto-fonts-cjk
    (roughly 300MB installed), which is disproportionate for one Discord
    badge. Installed ttf-unifont from the AUR instead (roughly 37MB): GNU
    Unifont deliberately covers the whole BMP as a last-resort fallback, and
    closes this gap to 0 of 239 uncovered. Its glyphs are visibly blocky
    (bitmap-derived), acceptable for a rarely-hit fallback, not for anyone's
    primary font, which is why it is listed after DejaVu Math TeX Gyre
    rather than before it.
  -->
  <alias>
    <family>sans-serif</family>
    <default>
      <family>DejaVu Math TeX Gyre</family>
      <family>Unifont</family>
    </default>
  </alias>
  <alias>
    <family>serif</family>
    <default>
      <family>DejaVu Math TeX Gyre</family>
      <family>Unifont</family>
    </default>
  </alias>
  <alias>
    <family>monospace</family>
    <default>
      <family>DejaVu Math TeX Gyre</family>
      <family>Unifont</family>
    </default>
  </alias>
</fontconfig>
