# zram swap — compressed swap held in RAM.
#
# Why this exists on a machine that never touched its swap file:
# the 32 GB /swapfile sits at priority -2 and had 0 B used, because reaching
# disk swap on an NVMe is still orders of magnitude slower than RAM, so the
# kernel avoids it until it has no choice. By then the machine is already
# stuttering. zram gives the kernel somewhere cheap to put cold pages long
# before that point: pages are compressed with zstd and stay in RAM, typically
# at 3-4x, so 8 GB of zram holds roughly 24-32 GB of cold anonymous pages for
# 8 GB of address space and no I/O at all.
#
# The disk swap file is deliberately kept as the lower-priority tier below it.
# zram is tried first; /swapfile only catches what genuinely does not fit.
#
# NOTE: this does not lower idle memory use. It raises effective capacity and
# keeps the system responsive under pressure. The idle figure is attacked
# separately.

[zram0]
# Half of RAM. On 16 GB that is 8 GB of zram, which with zstd holds far more
# than 8 GB of real pages while leaving 8 GB of uncompressed RAM untouched.
# Sizing zram at or above 100% of RAM is a common mistake: the compressed data
# still lives in RAM, so an oversized device just competes with the working set.
zram-size = ram / 2

# zstd, not the lzo-rle default. On this CPU zstd compresses roughly 30% better
# at a latency that is still far below any disk access, and swap traffic is not
# hot enough for the speed difference to show.
compression-algorithm = zstd

# Above the /swapfile's -2, so the kernel fills zram first and only spills to
# disk when zram is genuinely full.
swap-priority = 100

# The kernel writes back only pages it has already tried to compress and found
# incompressible, which would otherwise waste zram on data that cannot shrink.
fs-type = swap
