# hypridle holds a logind delay-inhibitor while it waits for the
# session to actually finish locking before allowing suspend
# (inhibit_sleep=3, see hypridle.conf). Hyprland's own fallback is
# "Sending locked after a 5 second timeout" -- exactly equal to
# logind's 5s default -- so at the default this wait can be
# truncated at the worst possible moment. Rollback: rm this file,
# then `systemctl reload systemd-logind`.
[Login]
InhibitDelayMaxSec=10
