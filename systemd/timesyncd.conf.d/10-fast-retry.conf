# Default ConnectionRetrySec=30 meant that after a resume-triggered
# systemd-timesyncd restart raced ahead of Wi-Fi reconnecting, the first
# NTP attempt failed (no network yet) and the next retry didn't fire for
# a full 30s -- even though the network was actually usable much sooner.
# Measured 2026-09-13: Wi-Fi reconnected (NetworkManager CONNECTED_GLOBAL)
# at 08:40:18, but the next NTP contact didn't happen until 08:40:45,
# 27s after the network was already ready. A short retry means the next
# attempt lands within ~2s of the network actually being usable instead.
[Time]
ConnectionRetrySec=2
